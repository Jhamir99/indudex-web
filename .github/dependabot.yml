version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Stays on 5.x until Next and typescript-eslint support TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # One PR for all minor and patch updates; majors get their own PR.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
